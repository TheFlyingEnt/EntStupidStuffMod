# =============================================================
# Fabric Mod CI — Build & Test on every push and PR
# =============================================================

name: Build Fabric Mod

# ── TRIGGER ──────────────────────────────────────────────────
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# ── JOBS ─────────────────────────────────────────────────────
jobs:

  build:
    name: "Build & Verify"
    runs-on: ubuntu-latest

    steps:

      # ── Step 1: Check out the code ──
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Step 2: Install Java 21 ──
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ── Step 3: Cache Gradle files ──
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # ── Step 4: Make Gradle wrapper executable ──
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ── Step 5: Read version info from gradle.properties ──
      # Pulls minecraft_version and mod_version out of your existing
      # gradle.properties so the jar name stays in sync automatically.
      - name: Extract version info
        id: versions
        run: |
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "mc_version=$MC_VER" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VER" >> "$GITHUB_OUTPUT"
          echo "Minecraft: $MC_VER | Mod: $MOD_VER | Build: ${{ github.run_number }}"

      # ── Step 6: Build the mod ──
      - name: Build with Gradle
        run: ./gradlew build

      # ── Step 7: Rename the jar to your naming convention ──
      # entstupidstuff-alpha-[GameVersion]-[ModVersion]-[GithubBuild].jar
      - name: Rename mod jar
        run: |
          JAR_NAME="entstupidstuff-alpha-${{ steps.versions.outputs.mc_version }}-${{ steps.versions.outputs.mod_version }}-${{ github.run_number }}"
          mkdir -p build/release

          # Copy the main mod jar (skip the -sources jar)
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) continue ;;
              *)
                cp "$f" "build/release/${JAR_NAME}.jar"
                echo "Renamed: $f → ${JAR_NAME}.jar"
                ;;
            esac
          done

      # ── Step 8: Upload the renamed jar ──
      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: entstupidstuff-alpha-${{ steps.versions.outputs.mc_version }}-${{ steps.versions.outputs.mod_version }}-${{ github.run_number }}
          path: build/release/*.jar
          if-no-files-found: error
          retention-days: 14

  # ── RELEASE JOB (only on tagged pushes) ──────────────────
  release:
    name: "Create GitHub Release"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Extract version info
        id: versions
        run: |
          MC_VER=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          MOD_VER=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '[:space:]')
          echo "mc_version=$MC_VER" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VER" >> "$GITHUB_OUTPUT"

      - name: Build release jar
        run: ./gradlew build

      - name: Rename release jar
        run: |
          JAR_NAME="entstupidstuff-alpha-${{ steps.versions.outputs.mc_version }}-${{ steps.versions.outputs.mod_version }}-${{ github.run_number }}"
          mkdir -p build/release
          for f in build/libs/*.jar; do
            case "$f" in
              *-sources.jar) continue ;;
              *) cp "$f" "build/release/${JAR_NAME}.jar" ;;
            esac
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.jar
          generate_release_notes: true
          name: "entstupidstuff alpha ${{ steps.versions.outputs.mc_version }}-${{ steps.versions.outputs.mod_version }}-${{ github.run_number }}"