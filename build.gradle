plugins {
	id 'fabric-loom' version '1.11-SNAPSHOT'
	id 'maven-publish'
}

// === Auto Increment Version ===
def propsFile = file("gradle.properties")
def props = new Properties()
props.load(propsFile.newInputStream())

def currentVersion = props["mod_version"]
def (major, minor, patch) = currentVersion.tokenize('.').collect { it as int }

// Increment PATCH by default
patch += 1
def newVersion = "${major}.${minor}.${patch}"

// Set it as current project version
version = newVersion

// Update gradle.properties after build
tasks.register("incrementVersion") {
    doLast {
        // Make sure version is written as a plain String
        props["mod_version"] = newVersion.toString()

        // Safely write back to gradle.properties
        props.store(propsFile.newWriter(false), null)

        println "✅ Version updated: ${currentVersion} → ${newVersion}"
    }
}
// Automatically update after build
tasks.named("build") {
    finalizedBy("incrementVersion")
}

//Original File

version = project.mod_version
group = project.maven_group

base {
	//archivesName = project.archives_base_name
	archivesName = "${project.archives_base_name}-${project.minecraft_version}"
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.

	maven { url = 'https://maven.minecraftforge.net/' }
}

fabricApi {
	configureDataGeneration() {
		client = true
	}
}

tasks.withType(AbstractArchiveTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

dependencies {
	// To change the versions see the gradle.properties file

    // Source: https://mvnrepository.com/artifact/net.fabricmc/fabric-loom
    //implementation("net.fabricmc:fabric-loom:1.12.5")

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	//mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	// TerraBlender - Need for Biome Support
	modImplementation 'com.github.glitchfiend:TerraBlender-fabric:1.21.10-21.10.0.0'

	
}


processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

tasks.processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}


//Double Run-Time
loom {
    runs {
        client {
            client()
            name "Minecraft Client"
            source sourceSets.main
        }

        
        client2 {
            inherit client

            // REQUIRED in Loom 1.11+
            environment = "client"

            configName = "Minecraft Client 2"
            runDir = "run2"

            vmArg "-Dfabric.loom.username=DevPlayer2"
        }
    }
}